<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Alter Ego">
  <!-- Trois cercles qui se recouvrent : ce que le jeu mesure, c'est la zone
       commune, et elle s'éclaircit là où les trois se rejoignent. Trois et non
       deux, volontairement — deux cercles auraient redit « couple », alors
       qu'on joue à plusieurs. L'icône d'avant était un cœur percé d'une flèche
       de Cupidon : sur un écran d'accueil, elle annonçait une appli de
       rencontre avant même qu'on lise le nom.
       Le groupe est isolé pour que les cercles se mélangent entre eux et non
       avec le fond, qui resterait sinon visible au travers du premier. -->
  <rect width="512" height="512" rx="112" fill="#17122a"/>
  <g style="isolation:isolate">
    <circle cx="256" cy="184" r="116" fill="#ff6f9c" style="mix-blend-mode:screen"/>
    <circle cx="186" cy="306" r="116" fill="#7c5cff" style="mix-blend-mode:screen"/>
    <circle cx="326" cy="306" r="116" fill="#ffd23f" style="mix-blend-mode:screen"/>
  </g>
</svg>
